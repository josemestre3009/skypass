<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Cambiar Nombre de Red</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        body { background: #f7f9fb; }
        .navbar { background: #fff !important; border-bottom: 1px solid #e5e7eb; min-height: 70px; box-shadow: 0 2px 8px 0 rgba(31,38,135,0.04); }
        .navbar-brand img { height: 48px !important; width: auto; cursor: pointer; }
        .navbar .btn { border-radius: 2rem !important; }
        .main-box { max-width: 500px; margin: 100px auto 0 auto; }
        .card { border-radius: 1.2rem; box-shadow: 0 4px 24px 0 rgba(31,38,135,0.07); border: none; }
        .btn-outline-primary, .btn-secondary, .btn-success { border-radius: 2rem !important; }
        .titulo { font-size: 2rem; font-weight: 700; color: #2563eb; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; justify-content: center; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center px-3">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
            </a>
            <form method="POST" action="{{ url_for('cerrar_sesion') }}" class="mb-0">
                <button class="btn btn-outline-danger rounded-pill px-4" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </nav>
    <div class="main-box">

        <div class="card p-4">
            <div class="titulo">🌐 Cambiar Nombre de la Red Wifi</div>

            <form id="form-cambiar-nombre">
                <div class="mb-3">
                    <label for="nuevo_nombre" class="form-label">Nuevo Nombre</label>
                    <input type="text" class="form-control" id="nuevo_nombre" name="nuevo_nombre" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">Guardar Nombre</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Volver al Inicio</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Validar dispositivo en segundo plano al cargar la página
        validarDispositivoEnSegundoPlano();
        
        const form = document.getElementById('form-cambiar-nombre');
        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Verificar que el dispositivo esté validado
                if (!window.deviceValidado) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Validando dispositivo...',
                        text: 'Por favor espera mientras validamos tu dispositivo.',
                        showConfirmButton: false,
                        timer: 2000
                    });
                    return;
                }
                
                // Mostrar modal de carga
                Swal.fire({
                    title: 'Procesando tu solicitud',
                    html: '<div id="swal-mensaje">Enviando mensaje de WhatsApp...</div><div class="progress mt-3" style="height: 8px;"><div id="swal-barra" class="progress-bar bg-primary" role="progressbar" style="width: 0%"></div></div>',
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                    showConfirmButton: false,
                    didOpen: () => { Swal.showLoading(); }
                });
                
                // Barra de progreso
                const barra = document.getElementById('swal-barra');
                let barraInterval = null;
                if (barra) {
                    let progreso = 0;
                    barra.style.width = '0%';
                    barraInterval = setInterval(() => {
                        progreso += 2;
                        barra.style.width = progreso + '%';
                        if (progreso >= 100) clearInterval(barraInterval);
                    }, 100);
                }
                
                // Enviar WhatsApp
                let formData = new FormData(form);
                let data = {};
                formData.forEach((value, key) => { data[key] = value; });
                
                let mensajeDiv = document.getElementById('swal-mensaje');
                if (mensajeDiv) mensajeDiv.innerHTML = 'Enviando mensaje de WhatsApp...';
                
                let resp1 = await fetch(window.location.pathname + '?accion=whatsapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                let res1 = await resp1.json();
                
                if (!res1.success) {
                    if (barraInterval) clearInterval(barraInterval);
                    Swal.fire({ icon: 'error', title: 'Error', text: 'Error al enviar WhatsApp: ' + (res1.message || '') });
                    return;
                }
                
                // Cambiar nombre de red
                await new Promise(r => setTimeout(r, 1000));
                if (mensajeDiv) mensajeDiv.innerHTML = 'Aplicando nombre a redes WiFi...';
                
                let resp2 = await fetch(window.location.pathname + '?accion=cambiar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                let res2 = await resp2.json();
                
                if (!res2.success) {
                    if (barraInterval) clearInterval(barraInterval);
                    Swal.fire({ icon: 'error', title: 'Error', text: 'Error al cambiar el nombre de la red: ' + (res2.message || '') });
                    return;
                }
                
                // Éxito
                if (barra) barra.style.width = '100%';
                await new Promise(r => setTimeout(r, 1000));
                Swal.fire({
                    icon: 'success',
                    title: '¡Nombre de red actualizado exitosamente!',
                    showConfirmButton: false,
                    timer: 1800
                });
                setTimeout(() => { window.location.href = '/dashboard'; }, 1800);
            });
        }
        
        // Función para validar dispositivo en segundo plano
        async function validarDispositivoEnSegundoPlano() {
            try {
                const response = await fetch(window.location.pathname + '?accion=validar_dispositivo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                
                if (result.success) {
                    window.deviceValidado = true;
                    mostrarEstadoDispositivo(result);
                } else {
                    mostrarErrorDispositivo(result.message);
                }
            } catch (error) {
                console.error('Error validando dispositivo:', error);
                mostrarErrorDispositivo('Error de conexión');
            }
        }
        
        // Mostrar estado del dispositivo (sin mostrar información técnica)
        function mostrarEstadoDispositivo(data) {
            // Solo validar internamente, no mostrar información técnica al usuario
            console.log('Dispositivo validado:', data);
            
            // Mostrar información de redes disponibles
            if (data.interfaces_info && Object.keys(data.interfaces_info).length > 0) {
                mostrarRedesDisponibles(data.interfaces_info, data.interfaces_count);
            }
        }
        
        // Mostrar redes disponibles
        function mostrarRedesDisponibles(interfaces_info, interfaces_count) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-info';
            
            let redesInfo = '<strong>📡 Red WiFi Detectada:</strong><br>';
            
            // Si hay múltiples interfaces, mostrar todas
            if (interfaces_count > 1) {
                redesInfo = '<strong>📡 Redes WiFi Detectadas:</strong><br>';
                for (const [interfaz, info] of Object.entries(interfaces_info)) {
                    const icono = info.frecuencia === '2.4GHz' ? '📶' : '🚀';
                    const ssidActual = info.ssid_actual || 'Desconocido';
                    redesInfo += `${icono} <strong>${info.frecuencia}</strong> - Nombre actual: "${ssidActual}"<br>`;
                }
                redesInfo += '<small>El nuevo nombre se aplicará a ambas redes automáticamente.</small>';
            } else {
                // Si hay una sola interfaz, mostrar su SSID
                const primeraInterfaz = Object.keys(interfaces_info)[0];
                const info = interfaces_info[primeraInterfaz];
                const ssidActual = info.ssid_actual || 'Desconocido';
                redesInfo += `📶 Nombre actual de la red: <strong>"${ssidActual}"</strong>`;
            }
            
            alertDiv.innerHTML = redesInfo;
            
            const form = document.getElementById('form-cambiar-nombre');
            form.parentNode.insertBefore(alertDiv, form);
        }
        
        // Mostrar error del dispositivo
        function mostrarErrorDispositivo(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-danger';
            alertDiv.innerHTML = `<strong>⚠️ Error:</strong> ${message}`;
            
            const form = document.getElementById('form-cambiar-nombre');
            form.parentNode.insertBefore(alertDiv, form);
        }
    });
    </script>

    <script>
    let tiempoInactividad = 4 * 60 * 1000; // 4 minutos
    let tiempoExpiracion = 5 * 60 * 1000; // 5 minutos
    let alertaMostrada = false;
    let timeoutAlerta, timeoutCerrar;

    function resetTimers() {
        clearTimeout(timeoutAlerta);
        clearTimeout(timeoutCerrar);
        alertaMostrada = false;
        timeoutAlerta = setTimeout(mostrarAlertaSesion, tiempoInactividad);
        timeoutCerrar = setTimeout(cerrarSesion, tiempoExpiracion);
    }

    function mostrarAlertaSesion() {
        alertaMostrada = true;
        Swal.fire({
            title: '¿Quieres continuar en tu sesión?',
            text: 'Tu sesión está a punto de expirar por inactividad.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Continuar en mi sesión',
            cancelButtonText: 'Cerrar sesión',
            allowOutsideClick: false,
            allowEscapeKey: false
        }).then((result) => {
            if (result.isConfirmed) {
                fetch('/renovar_sesion', {method: 'POST'})
                    .then(() => {
                        resetTimers();
                        Swal.fire({
                            icon: 'success',
                            title: '¡Sesión renovada!',
                            timer: 1000,
                            showConfirmButton: false
                        });
                    });
            } else {
                cerrarSesion();
            }
        });
    }

    function cerrarSesion() {
        fetch('/cerrar_sesion', {method: 'POST'})
            .then(() => {
                window.location.href = '/';
            });
    }

    function verificarSesionActiva() {
        fetch('/verificar_sesion', {method: 'POST'})
            .then(res => {
                if (res.status === 401) {
                    window.location.href = '/';
                }
                return res.json();
            })
            .catch(() => {
                window.location.href = '/';
            });
    }

    ['click', 'mousemove', 'keydown', 'scroll', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, function() {
            if (!alertaMostrada) resetTimers();
        }, true);
    });

    window.onload = function() {
        resetTimers();
        setInterval(verificarSesionActiva, 30000);
    };
    </script>
</body>
</html>

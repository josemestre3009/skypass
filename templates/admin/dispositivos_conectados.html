<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispositivos Conectados - WISP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body { background: #f7f9fb; }
        .dashboard-title-no-box {
            font-size: 2rem;
            font-weight: 700;
            color: #2563eb;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            justify-content: center;
        }
        .card {
            border-radius: 1.2rem;
            box-shadow: 0 4px 24px 0 rgba(31, 38, 135, 0.07);
            border: none;
        }
        .btn-outline-primary, .btn-primary {
            border-radius: 2rem;
        }
        .navbar {
            background: #fff !important;
            border-bottom: 1px solid #e5e7eb;
            min-height: 70px;
            box-shadow: 0 2px 8px 0 rgba(31,38,135,0.04);
        }
        .navbar-brand img {
            height: 48px !important;
            width: auto;
            cursor: pointer;
        }
        .navbar .btn {
            border-radius: 2rem !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center px-3">
            <a class="navbar-brand" href="{{ url_for('admin.dashboard') }}">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
            </a>
            <form id="form-logout-admin" class="mb-0">
                <button type="submit" class="btn btn-outline-danger rounded-pill px-4">Cerrar Sesión</button>
            </form>
        </div>
    </nav>
    <div class="dashboard-bg">
        <div class="dashboard-title-no-box">
            <i class="bi bi-hdd-network text-success"></i>
            <span>Dispositivos Conectados</span>
        </div>
        <div class="container-fluid maxw-1100">
            <div class="card shadow p-4">
                <div class="d-flex justify-content-between mb-3 flex-column flex-md-row gap-2">
                    <div class="col-12 col-md-6">
                        <input type="text" class="form-control" id="filtro-busqueda" placeholder="Buscar por IP o ID...">
                    </div>
                    <button class="btn btn-primary" id="btn-refrescar"><i class="bi bi-arrow-clockwise"></i> Refrescar</button>
                </div>
                <!-- Resumen de conteos -->
                <div class="row g-3 mb-3" id="summary-cards">
                    <div class="col-12 col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center justify-content-between">
                                <div>
                                    <div class="text-muted small">Conectados</div>
                                    <div class="fw-bold fs-4" id="count-conectados">0</div>
                                </div>
                                <i class="bi bi-wifi text-success fs-3"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center justify-content-between">
                                <div>
                                    <div class="text-muted small">Desconectados</div>
                                    <div class="fw-bold fs-4" id="count-desconectados">0</div>
                                </div>
                                <i class="bi bi-wifi-off text-danger fs-3"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center justify-content-between">
                                <div>
                                    <div class="text-muted small">Inactivos</div>
                                    <div class="fw-bold fs-4" id="count-inactivos">0</div>
                                </div>
                                <i class="bi bi-exclamation-triangle text-warning fs-3"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center justify-content-between">
                                <div>
                                    <div class="text-muted small">Total dispositivos</div>
                                    <div class="fw-bold fs-4" id="count-total">0</div>
                                </div>
                                <i class="bi bi-hdd-network text-primary fs-3"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped align-middle mb-0" id="tabla-dispositivos">
                        <thead class="table-light">
                            <tr>
                                <th style="cursor: pointer;" onclick="sortTable('device_id')" class="border-bottom">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <span>ID del Dispositivo</span>
                                        <i class="bi bi-arrow-down-up text-muted"></i>
                                    </div>
                                </th>
                                <th style="cursor: pointer;" onclick="sortTable('ip')" class="border-bottom">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <span>Dirección IP</span>
                                        <i class="bi bi-arrow-down-up text-muted"></i>
                                    </div>
                                </th>
                                <th style="cursor: pointer;" onclick="sortTable('last_inform')" class="border-bottom">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <span>Último Informe</span>
                                        <i class="bi bi-arrow-down-up text-muted"></i>
                                    </div>
                                </th>
                                <th style="cursor: pointer;" onclick="sortTable('estado')" class="border-bottom">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <span>Estado</span>
                                        <i class="bi bi-arrow-down-up text-muted"></i>
                                    </div>
                                </th>
                                <th class="border-bottom">
                                    <span>Acciones</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="tbody-dispositivos">
                            <tr><td colspan="5" class="text-secondary text-center">Cargando información...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Paginación -->
                <div id="pagination-container" class="mt-3"></div>
            </div>
        </div>
        <div class="d-flex justify-content-center mt-3 mb-4">
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-primary btn-lg rounded-pill px-4 shadow-sm">
                <i class="bi bi-house-door"></i> Volver al Dashboard
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='session-timeout.js') }}"></script>
    <script>
    let dispositivosData = [];
    let currentPage = 1;
    let itemsPerPage = 10;
    let sortColumn = 'device_id';
    let sortDirection = 'asc';
    
    function renderTabla(filtro = '') {
        const tbody = document.getElementById('tbody-dispositivos');
        let datos = dispositivosData;
        
        // Aplicar filtro
        if (filtro) {
            const f = filtro.toLowerCase();
            datos = datos.filter(d =>
                (d.device_id && d.device_id.toLowerCase().includes(f)) ||
                (d.ip && d.ip.toLowerCase().includes(f)) ||
                (d.ultimo_informe && d.ultimo_informe.toLowerCase().includes(f))
            );
        }
        
        // Ordenar datos
        datos.sort((a, b) => {
            let aVal = a[sortColumn] || '';
            let bVal = b[sortColumn] || '';
            
            // Manejo especial para fechas
            if (sortColumn === 'last_inform') {
                const aDate = a.ultimo_informe ? new Date(a.ultimo_informe) : new Date(0);
                const bDate = b.ultimo_informe ? new Date(b.ultimo_informe) : new Date(0);
                
                if (sortDirection === 'asc') {
                    return aDate - bDate;
                } else {
                    return bDate - aDate;
                }
            }
            
            // Manejo especial para estado (basado en la fecha del último informe)
            if (sortColumn === 'estado') {
                const aDate = a.ultimo_informe ? new Date(a.ultimo_informe) : new Date(0);
                const bDate = b.ultimo_informe ? new Date(b.ultimo_informe) : new Date(0);
                
                if (sortDirection === 'asc') {
                    return aDate - bDate;
                } else {
                    return bDate - aDate;
                }
            }
            
            // Ordenamiento normal para otras columnas
            if (sortDirection === 'asc') {
                return aVal.localeCompare(bVal);
            } else {
                return bVal.localeCompare(aVal);
            }
        });
        // Calcular resumen de conteos
        actualizarResumen(datos);

        // Calcular paginación
        const totalPages = Math.ceil(datos.length / itemsPerPage);
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const dispositivosPaginados = datos.slice(startIndex, endIndex);
        
        // Renderizar tabla
        if (dispositivosPaginados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-warning text-center">No hay datos para mostrar.</td></tr>';
        } else {
            tbody.innerHTML = '';
            dispositivosPaginados.forEach(d => {
                tbody.innerHTML += `
                    <tr class="align-middle">
                        <td>
                            <div class="d-flex align-items-center">
                                <i class="bi bi-router text-primary me-2"></i>
                                <span class="fw-medium">${d.device_id || 'N/A'}</span>
                            </div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border">${d.ip || 'N/A'}</span>
                        </td>
                        <td>
                            <span class="text-muted">${d.ultimo_informe ? new Date(d.ultimo_informe).toLocaleString() : 'N/A'}</span>
                        </td>
                        <td>
                            ${getEstadoDispositivo(d.ultimo_informe)}
                        </td>
                        <td>
                            <button class="btn btn-outline-danger btn-sm" onclick="eliminarDevice('${d.device_id}', '${d.ip}')" title="Eliminar dispositivo">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }
        
        // Renderizar paginación
        renderPagination(totalPages, datos.length);
    }
    
    function renderPagination(totalPages, totalItems) {
        const paginationContainer = document.getElementById('pagination-container');
        if (!paginationContainer) return;
        
        let paginationHTML = `
            <div class="d-flex justify-content-between align-items-center">
                <div class="text-muted">
                    Mostrando ${((currentPage - 1) * itemsPerPage) + 1} a ${Math.min(currentPage * itemsPerPage, totalItems)} de ${totalItems} dispositivos
                </div>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
        `;
        
        // Botón anterior
        paginationHTML += `
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
        `;
        
        // Páginas
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(totalPages, currentPage + 2);
        
        for (let i = startPage; i <= endPage; i++) {
            paginationHTML += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                </li>
            `;
        }
        
        // Botón siguiente
        paginationHTML += `
            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        `;
        
        paginationHTML += `
                    </ul>
                </nav>
            </div>
        `;
        
        paginationContainer.innerHTML = paginationHTML;
    }
    
    function changePage(page) {
        currentPage = page;
        renderTabla(document.getElementById('filtro-busqueda').value);
    }
    
    function getEstadoDispositivo(ultimoInforme) {
        if (!ultimoInforme) {
            return '<span class="badge bg-secondary"><i class="bi bi-question-circle"></i> Sin datos</span>';
        }
        
        const ahora = new Date();
        const ultimoInformeDate = new Date(ultimoInforme);
        const diferenciaHoras = (ahora - ultimoInformeDate) / (1000 * 60 * 60);
        
        if (diferenciaHoras <= 1) {
            // Conectado: último informe hace menos de 1 hora
            return '<span class="badge bg-success"><i class="bi bi-wifi"></i> Conectado</span>';
        } else if (diferenciaHoras <= 24) {
            // Desconectado: último informe hace más de 1 hora pero menos de 24 horas
            return '<span class="badge bg-danger"><i class="bi bi-wifi-off"></i> Desconectado</span>';
        } else {
            // Inactivo: último informe hace más de 24 horas
            return '<span class="badge bg-warning"><i class="bi bi-exclamation-triangle"></i> Inactivo</span>';
        }
    }

    function obtenerEstadoLabel(ultimoInforme) {
        if (!ultimoInforme) return 'sin_datos';
        const ahora = new Date();
        const ultimoInformeDate = new Date(ultimoInforme);
        const diferenciaHoras = (ahora - ultimoInformeDate) / (1000 * 60 * 60);
        if (diferenciaHoras <= 1) return 'conectado';
        if (diferenciaHoras <= 24) return 'desconectado';
        return 'inactivo';
    }

    function actualizarResumen(datos) {
        const total = datos.length;
        let conectados = 0, desconectados = 0, inactivos = 0;
        datos.forEach(d => {
            const est = obtenerEstadoLabel(d.ultimo_informe);
            if (est === 'conectado') conectados++;
            else if (est === 'desconectado') desconectados++;
            else if (est === 'inactivo') inactivos++;
        });
        const elTotal = document.getElementById('count-total');
        const elCon = document.getElementById('count-conectados');
        const elDes = document.getElementById('count-desconectados');
        const elIna = document.getElementById('count-inactivos');
        if (elTotal) elTotal.textContent = total;
        if (elCon) elCon.textContent = conectados;
        if (elDes) elDes.textContent = desconectados;
        if (elIna) elIna.textContent = inactivos;
    }
    
    function sortTable(column) {
        if (sortColumn === column) {
            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            sortColumn = column;
            sortDirection = 'asc';
        }
        currentPage = 1; // Reset a la primera página
        renderTabla(document.getElementById('filtro-busqueda').value);
        
        // Actualizar iconos de ordenamiento
        document.querySelectorAll('th i').forEach(icon => {
            icon.className = 'bi bi-arrow-down-up';
        });
        
        const currentIcon = document.querySelector(`th[onclick="sortTable('${column}')"] i`);
        if (currentIcon) {
            currentIcon.className = sortDirection === 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down';
        }
    }
    
    
    function cargarDispositivos() {
        const tbody = document.getElementById('tbody-dispositivos');
        tbody.innerHTML = '<tr><td colspan="4" class="text-secondary text-center">Cargando información...</td></tr>';
        fetch('/admin/api/dispositivos_conectados')
            .then(res => {
                // Si la respuesta es 302 (redirección), significa que la sesión expiró
                if (res.status === 302) {
                    window.location.href = '/admin/login';
                    return;
                }
                return res.json();
            })
            .then(data => {
                if (!data) return; // Si no hay datos, no actualizar
                
                if (data.success && data.dispositivos.length > 0) {
                    dispositivosData = data.dispositivos;
                    currentPage = 1; // Reset a la primera página
                    renderTabla(document.getElementById('filtro-busqueda').value);
                } else if (data.success && data.dispositivos.length === 0) {
                    dispositivosData = [];
                    renderTabla();
                } else {
                    tbody.innerHTML = `<tr><td colspan='5' class='text-danger text-center'>${data.error || 'No se pudieron obtener los datos de los dispositivos.'}</td></tr>`;
                }
            })
            .catch(err => {
                // En caso de error de red, no mostrar error
                console.log('Error al cargar dispositivos:', err);
            });
    }
    
    document.getElementById('btn-refrescar').addEventListener('click', cargarDispositivos);
    document.getElementById('filtro-busqueda').addEventListener('input', function() {
        currentPage = 1; // Reset a la primera página al filtrar
        renderTabla(this.value);
    });
    window.onload = cargarDispositivos;
    
    // Verificación de sesión automática
    function verificarSesionAdmin() {
        fetch('/admin/verificar-sesion', {method: 'POST'})
            .then(res => {
                if (res.status === 401) {
                    window.location.href = '/admin/login';
                }
                return res.json();
            })
            .catch(() => {
                window.location.href = '/admin/login';
            });
    }

    // Verificar sesión cada 20 segundos
    setInterval(verificarSesionAdmin, 20000);
    
    // Función para eliminar un dispositivo
    async function eliminarDevice(deviceId, ip) {
        try {
            // Decodificar el device_id si está codificado
            const deviceIdDecoded = deviceId ? decodeURIComponent(deviceId) : deviceId;
            const displayId = deviceIdDecoded || ip;
            
            const result = await Swal.fire({
                title: '¿Eliminar dispositivo?',
                text: `¿Estás seguro de que deseas eliminar el dispositivo ${displayId}? Esta acción no se puede deshacer.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d'
            });
            
            if (result.isConfirmed) {
                const response = await fetch('/admin/eliminar_device', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        device_id: deviceId,
                        ip: ip
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Dispositivo eliminado',
                        text: 'El dispositivo ha sido eliminado exitosamente.',
                        timer: 2000,
                        showConfirmButton: false
                    });
                    // Recargar la lista de dispositivos
                    setTimeout(() => {
                        cargarDispositivos();
                    }, 2000);
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message || 'No se pudo eliminar el dispositivo.'
                    });
                }
            }
        } catch (error) {
            console.error('Error al eliminar dispositivo:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Error de conexión al eliminar el dispositivo.'
            });
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        const formLogout = document.getElementById('form-logout-admin');
        if (formLogout) {
            formLogout.addEventListener('submit', async function(e) {
                e.preventDefault();
                let resp = await fetch("{{ url_for('admin.logout') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                let res = await resp.json();
                if (res.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Sesión cerrada',
                        showConfirmButton: false,
                        timer: 1200
                    });
                    setTimeout(() => { window.location.href = res.redirect || '/admin/login'; }, 1200);
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: res.message || 'No se pudo cerrar la sesión.' });
                }
            });
        }
    });
    </script>
</body>
</html>

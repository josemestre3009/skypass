<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} - SkyPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        :root {
            --sidebar-w: 230px;
            --color-primary: #2563eb;
            --color-primary-light: #eff6ff;
            --color-text: #374151;
            --color-muted: #9ca3af;
            --color-border: #e5e7eb;
            --color-hover: #f3f4f6;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f6f9; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: var(--sidebar-w);
            background: #fff;
            border-right: 1px solid var(--color-border);
            display: flex; flex-direction: column;
            z-index: 200; overflow-y: auto;
        }

        /* Logo area — centrado */
        .sidebar-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 1rem 1rem;
            border-bottom: 1px solid var(--color-border);
        }
        .sidebar-logo img {
            height: 48px;
            width: auto;
            display: block;
            max-width: calc(var(--sidebar-w) - 2rem);
            object-fit: contain;
        }

        /* Nav */
        .sidebar-nav { flex: 1; padding: 0.75rem 0; }

        .nav-section-label {
            padding: 0.75rem 1.25rem 0.3rem;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--color-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin: 1px 0.6rem;
            padding: 0.52rem 0.85rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.855rem;
            font-weight: 500;
            border-radius: 0.5rem;
            transition: background 0.12s, color 0.12s;
            position: relative;
        }
        .nav-item i {
            font-size: 1rem;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
            color: var(--color-muted);
            transition: color 0.12s;
        }
        .nav-item:hover {
            background: var(--color-hover);
            color: #111;
        }
        .nav-item:hover i { color: #374151; }
        .nav-item.active {
            background: var(--color-primary-light);
            color: var(--color-primary);
            font-weight: 600;
        }
        .nav-item.active i { color: var(--color-primary); }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 20%; bottom: 20%;
            width: 3px;
            background: var(--color-primary);
            border-radius: 0 2px 2px 0;
        }

        /* Footer con WA status + logout */
        .sidebar-footer {
            padding: 0.85rem 1rem;
            border-top: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        /* WhatsApp status pill */
        .wa-status-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.78rem;
            font-weight: 500;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .wa-status-pill.offline {
            background: #fff7ed;
            color: #9a3412;
            border-color: #fed7aa;
        }
        .wa-status-pill.loading {
            background: #f9fafb;
            color: var(--color-muted);
            border-color: var(--color-border);
        }
        .wa-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #22c55e;
        }
        .wa-dot.pulse {
            animation: waPulse 2s infinite;
        }
        .wa-dot.offline { background: #f97316; animation: none; }
        .wa-dot.loading { background: var(--color-muted); animation: none; }
        @keyframes waPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.35); }
            50%       { box-shadow: 0 0 0 4px rgba(34,197,94,0); }
        }

        /* Logout button */
        .btn-logout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            width: 100%;
            padding: 0.45rem 0.75rem;
            font-size: 0.82rem;
            font-weight: 500;
            color: #6b7280;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
        }
        .btn-logout:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        /* Botones semi-redondos globales */
        .btn { border-radius: 0.45rem !important; }

        /* Main */
        .main-area {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            padding: 1.75rem 2rem 2.5rem;
        }
        .page-topbar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .page-title { font-size: 1.35rem; font-weight: 700; color: #111; }

        /* Mobile */
        .mobile-toggle { display: none; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.22s; }
            .sidebar.open { transform: translateX(0); }
            .main-area { margin-left: 0; padding: 1rem; padding-top: 4rem; }
            .mobile-toggle {
                display: flex !important;
                position: fixed; top: 0.75rem; left: 0.75rem; z-index: 300;
                background: #fff; border: 1px solid var(--color-border);
                border-radius: 0.45rem; padding: 0.4rem 0.55rem;
                cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
                align-items: center;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>

<button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list" style="font-size:1.2rem;"></i>
</button>

<div class="sidebar">
    <!-- Logo solo -->
    <div class="sidebar-logo">
        <a href="{{ url_for('admin.dashboard_admin') }}">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SkyPass">
        </a>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <a href="{{ url_for('admin.dashboard_admin') }}" class="nav-item {% block nav_dashboard %}{% endblock %}">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="{{ url_for('admin.historial') }}" class="nav-item {% block nav_historial %}{% endblock %}">
            <i class="bi bi-clock-history"></i> Historial de cambios
        </a>
        <a href="{{ url_for('admin.limites') }}" class="nav-item {% block nav_limites %}{% endblock %}">
            <i class="bi bi-sliders"></i> Límites de cambios
        </a>

        <div class="nav-section-label" style="margin-top:0.25rem;">Herramientas</div>
        <a href="{{ url_for('admin.clientes') }}" class="nav-item {% block nav_clientes %}{% endblock %}">
            <i class="bi bi-people"></i> Clientes
        </a>
        <a href="{{ url_for('admin.admin_dispositivos_conectados') }}" class="nav-item {% block nav_dispositivos %}{% endblock %}">
            <i class="bi bi-hdd-network"></i> Dispositivos
        </a>

        <div class="nav-section-label" style="margin-top:0.25rem;">Configuración</div>
        <a href="{{ url_for('admin.configuracion') }}" class="nav-item {% block nav_config %}{% endblock %}">
            <i class="bi bi-gear-fill"></i> Configuración
        </a>
    </nav>

    <div class="sidebar-footer">
        <!-- WhatsApp status -->
        <div class="wa-status-pill loading" id="wa-sidebar-pill">
            <span class="wa-dot loading" id="wa-sidebar-dot"></span>
            <i class="bi bi-whatsapp" style="font-size:0.85rem;"></i>
            <span id="wa-sidebar-text">WhatsApp</span>
        </div>
        <!-- Logout -->
        <form id="form-logout-sidebar">
            <button type="submit" class="btn-logout">
                <i class="bi bi-box-arrow-left"></i> Cerrar sesión
            </button>
        </form>
    </div>
</div>

<div class="main-area">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='session-timeout.js') }}"></script>
<script>
(function() {
    // Logout
    const form = document.getElementById('form-logout-sidebar');
    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const resp = await fetch("{{ url_for('admin.logout') }}", {
                method: 'POST', headers: {'Content-Type': 'application/json'}
            });
            const res = await resp.json();
            if (res.success) window.location.href = res.redirect || '/admin/login';
        });
    }

    // Session check
    function verificarSesion() {
        fetch('/admin/verificar-sesion', { method: 'POST' })
            .then(r => { if (r.status === 401) window.location.href = '/admin/login'; })
            .catch(() => { window.location.href = '/admin/login'; });
    }
    setInterval(verificarSesion, 20000);

    // WhatsApp status in sidebar
    function actualizarWA() {
        const pill = document.getElementById('wa-sidebar-pill');
        const dot  = document.getElementById('wa-sidebar-dot');
        const txt  = document.getElementById('wa-sidebar-text');
        if (!pill) return;
        fetch('/admin/estado-bot')
            .then(r => r.json())
            .then(data => {
                if (data.conectado) {
                    pill.className = 'wa-status-pill';
                    dot.className  = 'wa-dot pulse';
                    txt.textContent = 'WhatsApp activo';
                } else {
                    pill.className = 'wa-status-pill offline';
                    dot.className  = 'wa-dot offline';
                    txt.textContent = 'WhatsApp inactivo';
                }
            })
            .catch(() => {
                pill.className = 'wa-status-pill loading';
                dot.className  = 'wa-dot loading';
                txt.textContent = 'WhatsApp';
            });
    }
    actualizarWA();
    setInterval(actualizarWA, 30000);
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
